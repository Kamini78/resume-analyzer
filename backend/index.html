<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Analyzer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #6366f1, #8b5cf6); padding: 30px; text-align: center; }
.header h1 { font-size: 2.5rem; font-weight: 800; }
.header p { opacity: 0.9; margin-top: 8px; }
.container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
.card { background: #1e293b; border-radius: 16px; padding: 30px; margin-bottom: 24px; border: 1px solid #334155; }
.card h2 { font-size: 1.3rem; margin-bottom: 20px; color: #a78bfa; }
textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px; color: #e2e8f0; font-size: 14px; resize: vertical; min-height: 120px; }
.upload-area { border: 2px dashed #6366f1; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; }
.upload-area:hover { background: #6366f120; }
.upload-area input { display: none; }
.upload-area p { color: #94a3b8; margin-top: 10px; }
.file-list { margin-top: 16px; }
.file-item { background: #0f172a; border-radius: 8px; padding: 10px 16px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
.btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: none; padding: 14px 40px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: opacity 0.3s; }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.results { display: none; }
.candidate-card { background: #1e293b; border-radius: 16px; padding: 24px; margin-bottom: 20px; border: 1px solid #334155; }
.rank { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; }
.score-bar { background: #0f172a; border-radius: 99px; height: 8px; margin-top: 6px; }
.score-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #6366f1, #8b5cf6); transition: width 1s; }
.skill-tag { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 12px; margin: 3px; }
.matched { background: #064e3b; color: #6ee7b7; }
.missing { background: #7f1d1d; color: #fca5a5; }
.loading { text-align: center; padding: 40px; display: none; }
.spinner { width: 50px; height: 50px; border: 4px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.summary-box { background: #0f172a; border-radius: 8px; padding: 16px; margin-top: 16px; color: #94a3b8; }
</style>
</head>
<body>
<div class="header">
  <h1>🤖 AI Resume Analyzer</h1>
  <p>Upload resumes and match against job descriptions using AI</p>
</div>

<div class="container">
  <div class="card">
    <h2>📋 Job Description</h2>
    <textarea id="jd" placeholder="Paste the job description here..."></textarea>
  </div>

  <div class="card">
    <h2>📄 Upload Resumes (PDF, DOCX, TXT)</h2>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <div style="font-size: 3rem">📁</div>
      <p>Click to upload resumes</p>
      <p style="font-size: 12px; margin-top: 4px;">Supports PDF, DOCX, TXT</p>
      <input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt" onchange="handleFiles(this.files)">
    </div>
    <div class="file-list" id="fileList"></div>
  </div>

  <button class="btn" id="analyzeBtn" onclick="analyze()">🚀 Analyze Resumes</button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>AI is analyzing resumes...</p>
  </div>

  <div class="results" id="results">
    <div class="card">
      <h2>📊 Results</h2>
      <div id="summary"></div>
    </div>
    <div id="candidateList"></div>
  </div>
</div>

<script>
let files = [];

function handleFiles(newFiles) {
  files = [...files, ...newFiles];
  const list = document.getElementById('fileList');
  list.innerHTML = files.map((f, i) => `
    <div class="file-item">
      <span>📄 ${f.name}</span>
      <span style="color:#6ee7b7">${(f.size/1024).toFixed(1)} KB</span>
    </div>`).join('');
}

async function analyze() {
  const jd = document.getElementById('jd').value.trim();
  if (!jd) { alert('Please enter a job description!'); return; }
  if (files.length === 0) { alert('Please upload at least one resume!'); return; }

  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('results').style.display = 'none';

  const formData = new FormData();
  formData.append('job_description', jd);
  files.forEach(f => formData.append('resumes', f));

  try {
    const res = await fetch('http://127.0.0.1:8000/api/resumes/analyze', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    showResults(data);
  } catch(e) {
    alert('Error: ' + e.message);
  } finally {
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('loading').style.display = 'none';
  }
}

function showResults(data) {
  document.getElementById('results').style.display = 'block';
  document.getElementById('summary').innerHTML = `
    <p>Total Candidates: <strong>${data.total}</strong> &nbsp;|&nbsp; Average Score: <strong>${data.averageScore}/100</strong></p>`;

  document.getElementById('candidateList').innerHTML = data.candidates.map((c, i) => `
    <div class="candidate-card">
      <div style="display:flex; align-items:center; gap:16px; margin-bottom:16px">
        <div class="rank">#${i+1}</div>
        <div>
          <div style="font-size:1.3rem; font-weight:700">${c.name || 'Unknown'}</div>
          <div style="color:#94a3b8">${c.email || ''}</div>
        </div>
        <div style="margin-left:auto; font-size:2.5rem; font-weight:800; color:#a78bfa">${c.overallScore}</div>
      </div>
      ${c.error ? `<p style="color:#fca5a5">Error: ${c.error}</p>` : `
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:16px">
        ${scoreBar('Skills', c.skillsScore)}
        ${scoreBar('Experience', c.experienceScore)}
        ${scoreBar('Education', c.educationScore)}
      </div>
      <div style="margin-bottom:12px">
        <strong>Matched Skills:</strong><br>
        ${(c.matchedSkills||[]).map(s=>`<span class="skill-tag matched">✓ ${s}</span>`).join('')}
        ${(c.missingSkills||[]).map(s=>`<span class="skill-tag missing">✗ ${s}</span>`).join('')}
      </div>
      <div style="margin-bottom:12px">
        <strong>Strengths:</strong>
        ${(c.strengths||[]).map(s=>`<li style="color:#6ee7b7">${s}</li>`).join('')}
        <strong>Improvements:</strong>
        ${(c.improvements||[]).map(s=>`<li style="color:#fca5a5">${s}</li>`).join('')}
      </div>
      <div class="summary-box">${c.summary||''}</div>`}
    </div>`).join('');
}

function scoreBar(label, score) {
  return `<div>
    <div style="display:flex;justify-content:space-between"><span>${label}</span><strong>${score}</strong></div>
    <div class="score-bar"><div class="score-fill" style="width:${score}%"></div></div>
  </div>`;
}
</script>
</body>
</html>
